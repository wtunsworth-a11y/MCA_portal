name: Probe deforestation sources (one-off)

# Read-only: probes candidate near-real-time deforestation/disturbance assets in
# Earth Engine and prints findings to the log. Commits nothing. Remove after use.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Earth Engine API
        run: pip install --quiet earthengine-api
      - name: Probe
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: orodataportal
        run: python3 .github/scripts/probe_defor.py
