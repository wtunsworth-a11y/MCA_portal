name: Update GEE tiles

# Runs Earth Engine server-side (service account), renders each layer as a single
# PNG clipped to Oro, and commits those images plus app/data/gee_tiles.json (image
# paths + bbox) the static site overlays. Same-origin images avoid the CORS block
# on Earth Engine's tile server that MapLibre's WebGL raster can't work around.

on:
  schedule:
    - cron: "0 5 * * *"    # daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-gee
  cancel-in-progress: false

jobs:
  gee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Earth Engine API
        run: pip install --quiet earthengine-api
      - name: Generate tile URLs
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: orodataportal
        run: python3 .github/scripts/update_gee.py
      - name: Commit if changed
        run: |
          git add app/data/gee_tiles.json app/data/gee_*.png
          if ! git diff --cached --quiet; then
            git config user.name "gee-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh GEE layer images [skip ci]"
            git push
          else
            echo "No change."
          fi
